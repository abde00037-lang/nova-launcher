name: Release Nova Workbench

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v2.1.0 or v3.0.0)'
        required: true
        default: 'v2.1.9'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'

      - name: Run security regression tests
        shell: pwsh
        run: |
          dotnet run --project tests/Nova.Regression/Nova.Regression.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Security regression tests failed' }

      - name: Run profile switching regression tests
        shell: pwsh
        run: |
          dotnet run --project tests/Nova.GuiRegression/Nova.GuiRegression.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Profile switching regression tests failed' }

      - name: Determine release version
        id: ver
        shell: pwsh
        run: |
          $rawTag = "${{ github.event.inputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($rawTag)) {
            $rawTag = "${{ github.ref_name }}"
          }
          $ver = $rawTag.TrimStart('v', 'V')
          $projectVersion = ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version
          if ($ver -ne $projectVersion -or $ver -notmatch '^\d+\.\d+\.\d+$') { throw "Release tag version must match Directory.Build.props (x.y.z)" }
          Write-Output "tag=$rawTag" >> $env:GITHUB_OUTPUT
          Write-Output "version=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "Building tag=$rawTag (Version=$ver)"

      - name: Publish self-contained portable and OTA packages
        shell: pwsh
        run: |
          ./scripts/build-release-packages.ps1 -Version "${{ steps.ver.outputs.version }}"

      - name: Verify OTA against v2.1.0 portable baseline
        shell: pwsh
        run: |
          curl.exe -fLsS --retry 3 -o baseline-v2.1.0.zip https://github.com/abde00037-lang/nova-launcher/releases/download/v2.1.0/Nova-Portable-Full-win-x64.zip
          if ($LASTEXITCODE -ne 0) { throw 'Could not download baseline' }
          if ((Get-FileHash baseline-v2.1.0.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'af01fcdcf97a3aeb1ec15e1fb85dfcfb5bae8549feaf27acbacc07ec71b41c4d') { throw 'Baseline hash mismatch' }
          ./scripts/test-ota.ps1 -OtaZip nova-bin-win-x64.zip -BaselineZip baseline-v2.1.0.zip

      - name: Compile Lightweight Web Installer & Full Standalone Offline Setup (.exe)
        shell: pwsh
        run: |
          $v = "v${{ steps.ver.outputs.version }}"
          $csc = "$env:windir\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          $assemblyVersion = "${{ steps.ver.outputs.version }}.0"
          $webSrc = (Get-Content "installer\NovaWebSetup.cs" -Raw) -replace 'AssemblyVersion\("[^"]+"\)', "AssemblyVersion(`"$assemblyVersion`")" -replace 'AssemblyFileVersion\("[^"]+"\)', "AssemblyFileVersion(`"$assemblyVersion`")"
          Set-Content -Path "installer\NovaWebSetup.build.cs" -Value $webSrc -Encoding UTF8
          & $csc /nologo /target:winexe /optimize+ `
            /out:"Nova-Web-Setup.exe" `
            /win32icon:"src\Nova.App\app.ico" `
            /r:System.dll /r:System.Core.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll /r:System.IO.Compression.dll /r:System.IO.Compression.FileSystem.dll `
            "installer\NovaWebSetup.build.cs" "installer\SafeInstallerZip.cs"
          if ($LASTEXITCODE -ne 0) { throw 'Web installer compilation failed' }
          Remove-Item "installer\NovaWebSetup.build.cs" -Force -ErrorAction SilentlyContinue

          $offlineSrc = (Get-Content "installer\NovaOfflineSetup.cs" -Raw) -replace 'public const string EmbeddedVersion = "[^"]+";', "public const string EmbeddedVersion = `"$v`";" -replace 'AssemblyVersion\("[^"]+"\)', "AssemblyVersion(`"$assemblyVersion`")" -replace 'AssemblyFileVersion\("[^"]+"\)', "AssemblyFileVersion(`"$assemblyVersion`")" -replace 'Full offline installer for Nova Workbench v[0-9.]+', "Full offline installer for Nova Workbench $v"
          Set-Content -Path "installer\NovaOfflineSetup.build.cs" -Value $offlineSrc -Encoding UTF8

          & $csc /nologo /target:winexe /optimize+ `
            /out:"Nova-Setup-Full.exe" `
            /win32icon:"src\Nova.App\app.ico" `
            /resource:"Nova-Portable-Full-win-x64.zip,NovaFullPayload.zip" `
            /r:System.dll /r:System.Core.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll /r:System.IO.Compression.dll /r:System.IO.Compression.FileSystem.dll `
            "installer\NovaOfflineSetup.build.cs" "installer\SafeInstallerZip.cs"
          if ($LASTEXITCODE -ne 0) { throw 'Full installer compilation failed' }
          Remove-Item "installer\NovaOfflineSetup.build.cs" -Force -ErrorAction SilentlyContinue

      - name: Verify full installer in an isolated directory
        shell: pwsh
        run: ./scripts/test-installers-security.ps1 -FullInstaller Nova-Setup-Full.exe

      - name: Generate SHA256SUMS.txt
        shell: pwsh
        run: |
          $artifacts = @("Nova-Setup-Full.exe", "Nova-Web-Setup.exe", "Nova-Portable-Full-win-x64.zip", "nova-bin-win-x64.zip")
          $lines = foreach ($f in $artifacts) {
            $h = (Get-FileHash -Path $f -Algorithm SHA256).Hash.ToLowerInvariant()
            "$h  $f"
          }
          $lines | Set-Content -Path "SHA256SUMS.txt" -Encoding ASCII
          Get-Content "SHA256SUMS.txt"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Nova Launcher ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: |
            Nova-Setup-Full.exe
            Nova-Web-Setup.exe
            Nova-Portable-Full-win-x64.zip
            nova-bin-win-x64.zip
            SHA256SUMS.txt
