name: CI Build & Verify

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run security regression tests
        shell: pwsh
        run: |
          dotnet run --project tests/Nova.Regression/Nova.Regression.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Security regression tests failed' }

      - name: Run profile switching regression tests
        shell: pwsh
        run: |
          dotnet run --project tests/Nova.GuiRegression/Nova.GuiRegression.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Profile switching regression tests failed' }

      - name: Restore & Build Nova.Core, Nova.App (WPF), and nova-cli
        shell: pwsh
        run: |
          dotnet build src/Nova.App/Nova.csproj -c Release -r win-x64 --no-self-contained
          if ($LASTEXITCODE -ne 0) { throw "App build failed" }
          dotnet build src/Nova.Cli/nova-cli.csproj -c Release -r win-x64 --no-self-contained
          if ($LASTEXITCODE -ne 0) { throw "CLI build failed" }

      - name: Verify Standalone Installers Compile Cleanly
        shell: pwsh
        run: |
          $csc = "$env:windir\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:winexe /optimize+ `
            /out:"Nova-Web-Setup.exe" `
            /win32icon:"src\Nova.App\app.ico" `
            /r:System.dll /r:System.Core.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll /r:System.IO.Compression.dll /r:System.IO.Compression.FileSystem.dll `
            "installer\NovaWebSetup.cs" "installer\SafeInstallerZip.cs"
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }

      - name: Test installer archive safety
        shell: pwsh
        run: ./scripts/test-installers-security.ps1

      - name: CLI Smoke Check
        shell: pwsh
        run: |
          & "src/Nova.Cli/bin/Release/net8.0/win-x64/nova-cli.exe" help
          if ($LASTEXITCODE -ne 0) { throw "CLI smoke test failed" }

      - name: Test self-contained OTA overlay
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version
          ./scripts/build-release-packages.ps1 -Version $version
          curl.exe -fLsS --retry 3 -o baseline-v2.1.0.zip https://github.com/abde00037-lang/nova-launcher/releases/download/v2.1.0/Nova-Portable-Full-win-x64.zip
          if ($LASTEXITCODE -ne 0) { throw 'Could not download baseline' }
          if ((Get-FileHash baseline-v2.1.0.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'af01fcdcf97a3aeb1ec15e1fb85dfcfb5bae8549feaf27acbacc07ec71b41c4d') { throw 'Baseline hash mismatch' }
          ./scripts/test-ota.ps1 -OtaZip nova-bin-win-x64.zip -BaselineZip baseline-v2.1.0.zip
