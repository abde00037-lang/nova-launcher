name: Feature Request
description: Suggest an enhancement or new capability for Nova Launcher
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Feature Summary
      description: What problem does this solve, and how should it work?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any examples, mockups, or CLI behavior ideas.
